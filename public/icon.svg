<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Stoic Calibrated Ring (The Manson Ring of Focus) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="600" stroke-dashoffset="120"/>

  <!-- Atomic Elliptical Orbits (The Atomic Habit compound loops) -->
  <ellipse cx="256" cy="256" rx="145" ry="58" fill="none" stroke="rgba(251, 191, 36, 0.45)" stroke-width="5" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="145" ry="58" fill="none" stroke="rgba(52, 211, 153, 0.45)" stroke-width="5" transform="rotate(30 256 256)"/>

  <!-- Central Atomic Core (Nucleus of Identity: 1% compounding) -->
  <circle cx="256" cy="256" r="42" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="22" fill="#ffffff" opacity="0.9"/>
  
  <!-- Orbiting Atomic Particle -->
  <circle cx="360" cy="195" r="10" fill="#34d399" filter="url(#glow)"/>
  <circle cx="152" cy="317" r="8" fill="#fbbf24"/>
</svg>
